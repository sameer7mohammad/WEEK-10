<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prompt</title>
</head>
<body>
    <h2>Java Script Prompt Example</h2>
    <script>
        // Display a prompt message and store the user input
        let username = prompt("please enter your name:");
        alert ("Hello, " + username + "! Welcome to the website.");
    </script>
</body>
</html>
